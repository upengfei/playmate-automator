# PlayFlow CI/CD
#
# 每次向 main 推送（或手动触发）时：
#   1. 构建 Web 平台（构建失败会阻止发布，保证仓库始终是可部署版本）
#   2. 打包 Windows / macOS / Linux 三端 Agent 安装包（计算 SHA256）
#   3. 发布/更新 GitHub Release（tag: agent-v<package.json version>），上传安装包
#
# 发布后安装包拥有稳定的公开下载地址：
#   https://github.com/<owner>/<repo>/releases/latest/download/PlayFlowAgent-<version>-win-x64.zip
#
# 平台端读取环境变量 AGENT_DOWNLOAD_BASE（例如上面的 releases/latest/download/ 前缀），
# 版本接口与下载页会自动指向 GitHub Release，Agent 即可从公开 URL 下载与升级。

name: agent-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-release
  cancel-in-progress: false

jobs:
  build-web:
    name: 构建 Web 平台
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build

  package:
    name: 打包 Agent (${{ matrix.name }})
    needs: build-web
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: win-x64, platform: win32, arch: x64 }
          - { os: ubuntu-latest, name: linux-x64, platform: linux, arch: x64 }
          - { os: macos-latest, name: darwin-arm64, platform: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Agent 运行时依赖（playwright-core 等），打进安装包
      - run: npm ci --prefix agent-app
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: electron-packager
        run: >-
          bunx electron-packager . PlayFlowAgent
          --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
          --app-version="$VERSION" --icon=agent-app/assets/icon
          --out=electron-release --overwrite
          --prune=false
          --ignore='^/node_modules' --ignore='^/src' --ignore='^/public'
          --ignore='^/electron-release' --ignore='^/dist' --ignore='^/\.git'
        env:
          VERSION: ${{ steps.ver.outputs.version }}

      # ---------- macOS 代码签名 + 公证 ----------
      # 需要在仓库 Secrets 里配置（缺任意一项会自动跳过并产出未签名包）：
      #   MACOS_CERT_P12_BASE64  Developer ID Application 证书（.p12）的 base64
      #   MACOS_CERT_PASSWORD    导出 .p12 时设置的密码
      #   MACOS_SIGN_IDENTITY    如 "Developer ID Application: Your Name (TEAMID)"
      #   APPLE_ID               Apple 开发者账号邮箱
      #   APPLE_APP_PASSWORD     该账号的 App 专用密码
      #   APPLE_TEAM_ID          团队 ID
      - name: 签名与公证 (macOS)
        if: matrix.platform == 'darwin'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="electron-release/PlayFlowAgent-darwin-arm64/PlayFlowAgent.app"
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ] || [ -z "${MACOS_SIGN_IDENTITY:-}" ]; then
            echo "::warning::未配置苹果开发者证书，使用 ad-hoc 签名（首次打开会有 Gatekeeper 提示，右键打开或在系统设置中允许即可）"
            find "$APP/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.so" -o -perm -111 \) -print0 2>/dev/null |
              while IFS= read -r -d '' f; do
                codesign --force --sign - --entitlements agent-app/entitlements.mac.inherit.plist "$f" || true
              done
            for helper in "$APP/Contents/Frameworks/"*.app "$APP/Contents/Frameworks/"*.framework; do
              [ -e "$helper" ] || continue
              codesign --force --sign - --entitlements agent-app/entitlements.mac.inherit.plist "$helper" || true
            done
            codesign --force --sign - --entitlements agent-app/entitlements.mac.plist "$APP"
            echo "ad-hoc 签名完成"
            exit 0
          fi

          # 1) 把证书导入临时钥匙串
          KEYCHAIN="$RUNNER_TEMP/playflow-signing.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${MACOS_CERT_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          # 2) 由内向外签名（Electron 的框架与辅助进程必须先签）
          find "$APP/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.so" -o -perm -111 \) -print0 2>/dev/null |
            while IFS= read -r -d '' f; do
              codesign --force --timestamp --options runtime \
                --entitlements agent-app/entitlements.mac.inherit.plist \
                --sign "$MACOS_SIGN_IDENTITY" "$f" || true
            done
          for helper in "$APP/Contents/Frameworks/"*.app "$APP/Contents/Frameworks/"*.framework; do
            [ -e "$helper" ] || continue
            codesign --force --timestamp --options runtime \
              --entitlements agent-app/entitlements.mac.inherit.plist \
              --sign "$MACOS_SIGN_IDENTITY" "$helper"
          done
          codesign --force --timestamp --options runtime \
            --entitlements agent-app/entitlements.mac.plist \
            --sign "$MACOS_SIGN_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # 3) 公证并把票据钉进 .app（下载后无需再手动放行）
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" \
              --wait --timeout 45m
            xcrun stapler staple "$APP"
            spctl --assess -vv --type execute "$APP" || true
            echo "已完成签名 + 公证 + 票据钉入"
          else
            echo "::warning::已签名但未公证（缺 APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID）"
          fi

      - name: 归档安装包
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          DIR="electron-release/PlayFlowAgent-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p out
          if [ "${{ matrix.platform }}" = "linux" ]; then
            FILE="PlayFlowAgent-${VERSION}-linux-x64.tar.gz"
            tar -czf "out/$FILE" -C electron-release "PlayFlowAgent-linux-x64"
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            FILE="PlayFlowAgent-${VERSION}-darwin-arm64.zip"
            ditto -c -k --sequesterRsrc --keepParent "$DIR" "out/$FILE"
          else
            FILE="PlayFlowAgent-${VERSION}-win-x64.zip"
            (cd electron-release && zip -qr "../out/$FILE" "PlayFlowAgent-win32-x64")
          fi
          echo "file=$FILE" >> "$GITHUB_ENV"
      - name: 计算 SHA256
        shell: bash
        run: |
          cd out
          sha256sum "$file" > "$file.sha256"
          cat "$file.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: dist-agent
          merge-multiple: true
      - name: 生成发布清单与说明
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/agent-v${VERSION}"
          {
            echo "{"
            echo "  \"version\": \"${VERSION}\","
            echo "  \"artifacts\": ["
            first=1
            for f in dist-agent/PlayFlowAgent-*; do
              case "$f" in *.sha256) continue;; esac
              sha=$(cut -d' ' -f1 "$f.sha256")
              size=$(du -m "$f" | cut -f1)
              name=$(basename "$f")
              platform=linux; case "$name" in *win*) platform=win;; *darwin*) platform=darwin;; esac
              [ $first -eq 0 ] && echo ","
              first=0
              printf '    { "platform": "%s", "file": "%s", "sizeMB": %s, "sha256": "%s", "url": "%s/%s" }' \
                "$platform" "$name" "$size" "$sha" "$BASE" "$name"
            done
            echo
            echo "  ]"
            echo "}"
          } > dist-agent/agent-release.json
          {
            echo "## PlayFlow Agent v${VERSION}"
            echo
            echo "| 平台 | 文件 | 大小 | SHA256 |"
            echo "| --- | --- | --- | --- |"
            for f in dist-agent/PlayFlowAgent-*; do
              case "$f" in *.sha256) continue;; esac
              sha=$(cut -d' ' -f1 "$f.sha256")
              size=$(du -m "$f" | cut -f1)
              name=$(basename "$f")
              echo "| \`$name\` | $name | ${size} MB | \`$sha\` |"
            done
            echo
            echo "稳定下载地址（始终指向最新版本）："
            echo '```'
            echo "https://github.com/${{ github.repository }}/releases/latest/download/<文件名>"
            echo '```'
          } > release-notes.md
      - name: 创建/更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="agent-v${{ steps.ver.outputs.version }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "PlayFlow Agent v${{ steps.ver.outputs.version }}" \
            --notes-file release-notes.md \
            --latest \
            dist-agent/*
      - name: 输出公开下载地址
        run: |
          echo "安装包公开地址前缀："
          echo "https://github.com/${{ github.repository }}/releases/latest/download/"
          ls -1 dist-agent | grep -v sha256 | grep -v json
      - name: 登记发布清单到平台
        # 配置仓库 Secrets：PLATFORM_URL（平台地址）与 AGENT_RELEASE_TOKEN（与平台同名密钥一致）
        env:
          PLATFORM_URL: ${{ secrets.PLATFORM_URL }}
          AGENT_RELEASE_TOKEN: ${{ secrets.AGENT_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PLATFORM_URL:-}" ] || [ -z "${AGENT_RELEASE_TOKEN:-}" ]; then
            echo "未配置 PLATFORM_URL / AGENT_RELEASE_TOKEN，跳过平台登记"; exit 0
          fi
          curl -sS -X POST "${PLATFORM_URL%/}/api/public/agent/release" \
            -H "content-type: application/json" \
            -H "x-release-token: ${AGENT_RELEASE_TOKEN}" \
            --data-binary @dist-agent/agent-release.json
