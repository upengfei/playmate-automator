<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>PlayFlow Agent 首次使用配置</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f7f8fb;
        color: #1b1c22;
        padding: 28px 30px;
      }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p.sub { margin: 0 0 20px; color: #6b6f7d; font-size: 13px; }
      label { display: block; font-size: 12px; color: #4a4e5c; margin: 14px 0 6px; }
      input {
        width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 13px;
        border: 1px solid #d6d9e2; border-radius: 8px; background: #fff;
      }
      input:focus { outline: 2px solid #1a73e8; outline-offset: 1px; border-color: #1a73e8; }
      button {
        margin-top: 22px; width: 100%; padding: 10px; font-size: 14px; border: 0;
        border-radius: 8px; background: #1a73e8; color: #fff; cursor: pointer;
      }
      button.ghost { margin-top: 10px; background: transparent; color: #1a73e8; border: 1px solid #c4d4f0; }
      button:disabled { opacity: .6; cursor: default; }
      .msg { margin-top: 14px; font-size: 12px; min-height: 18px; line-height: 1.6; }
      .err { color: #c5221f; }
      .ok { color: #137333; }
      .hint { margin-top: 18px; font-size: 12px; color: #6b6f7d; line-height: 1.6; }
      code { background: #eceef4; padding: 1px 4px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>首次使用配置</h1>
    <p class="sub">填写平台地址与平台下发的节点令牌，验证通过后自动进入工作台。</p>

    <label for="url">平台地址</label>
    <input id="url" placeholder="https://your-platform.lovable.app" />

    <label for="token">节点令牌</label>
    <input id="token" placeholder="在平台复制的节点令牌" autocomplete="off" spellcheck="false" />

    <button id="go">验证并进入</button>
    <button id="offline" class="ghost">暂不连接平台，离线使用（仅录制与本地调试）</button>
    <div class="msg" id="msg"></div>

    <p class="hint">
      令牌在平台「客户端下载更新」页注册设备后复制，设备名称沿用平台上登记的名称。
      令牌保存在本机配置文件中，之后心跳、领取任务、回传日志与升级都会自动携带；
      需要更换时可在平台点<code>重置令牌</code>后重新配置。
    </p>

    <script>
      const $ = (id) => document.getElementById(id);
      const msg = $("msg");

      window.agentSetup.defaults().then((d) => {
        $("url").value = d.platformUrl || "";
        $("token").value = d.token || "";
      });

      $("go").addEventListener("click", async () => {
        const platformUrl = $("url").value.trim();
        const token = $("token").value.trim();
        if (!platformUrl || token.length < 16) {
          msg.className = "msg err";
          msg.textContent = "请填写平台地址与完整的节点令牌";
          return;
        }
        $("go").disabled = true;
        msg.className = "msg";
        msg.textContent = "正在向平台验证令牌…";
        const res = await window.agentSetup.verify({ platformUrl, token });
        if (res && res.ok) {
          msg.className = "msg ok";
          msg.textContent = `验证成功：${res.name}（${res.agentId}），正在启动工作台…`;
        } else {
          $("go").disabled = false;
          msg.className = "msg err";
          msg.textContent = "验证失败：" + ((res && res.error) || "请检查平台地址与网络");
        }
      });

      $("offline").addEventListener("click", async () => {
        $("offline").disabled = true;
        msg.className = "msg";
        msg.textContent = "已进入离线模式：录制、编排与本地调试可用，联网功能停用。";
        await window.agentSetup.offline();
      });
    </script>
  </body>
</html>
